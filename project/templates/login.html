<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>County Link | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="app-container">
    <div class="card" style="max-width: 480px; margin: 3rem auto;">
        <div class="logo-area" style="justify-content:center; margin-bottom: 1.5rem;">
            <div class="logo-icon"><i class="fas fa-bus"></i></div>
            <div class="brand"><h1>County Link</h1><p>Community Road</p></div>
        </div>
        <h2 id="authTitle" style="margin-bottom: 1.2rem;"></h2>
        <form id="authForm">
            <!-- Login fields -->
            <div id="loginFields">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" />
                </div>
            </div>
            <!-- Signup fields -->
            <div id="signupFields" hidden>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailSignup" placeholder="Enter your email" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordSignup" placeholder="Create a password" />
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+254712345678" />
                </div>
                <div class="form-group">
                    <label>I am a</label>
                    <div class="role-radio-group">
                        <label class="role-radio">
                            <input type="radio" name="roleSelect" value="passenger" checked />
                            <span class="radio-dot"></span> Passenger
                        </label>
                        <label class="role-radio">
                            <input type="radio" name="roleSelect" value="driver" />
                            <span class="radio-dot"></span> Driver
                        </label>
                    </div>
                </div>
                <div id="driverFields" hidden>
                    <div class="form-group">
                        <label>Vehicle Number Plate</label>
                        <input type="text" id="plate" placeholder="KBZ 123A" />
                    </div>
                    <div class="driver-note">
                        Note: Driver accounts require admin approval before you can access the system.
                    </div>
                </div>
            </div>
            <button type="submit" id="authSubmitBtn" class="btn-primary" style="width:100%; margin-top: 1rem;"></button>
        </form>
        <div id="toggleAuthWrap" style="text-align:center; margin-top: 1.2rem; font-size:0.9rem; opacity:0.7;">
            <span id="toggleAuthText"></span> <button id="toggleAuthMode" class="nav-btn" style="color:#F05E23; padding:0;"></button>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/storage.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
